id: s31_customer_policy_en
language: en
area: customer_comms
capabilities: [inbox]
timezone: America/New_York
persona:
  name: Rowan Demo
  email: rowan@example.invalid
  phone: +1-202-555-0151
  home_city: New York
  notes: Synthetic small-business owner of a mug shop. Draft only; every send needs my yes.
user_md: 'I run a small mug shop. Work inbox alias: work. Drafts are opted in for this attended turn. Voice: warm, brief, direct; sign Rowan. Follow my written reply SOPs. Send nothing.'
max_user_turns: 1
budget_seconds: 900
seed:
- operation: profile
  data:
    action: remember
    kind: sop
    state: owned
    title: Refund requests
    trigger: Customer refund requests, damaged items or complaints.
    steps:
    - Offer a refund up to USD 50 for a damaged item once the customer sends a photo, if this is not a repeat refund.
    - Ground the held draft in the thread; ask the owner before any send.
    tools: [lab_mail_get, lab_mail_draft]
    done_when: Policy-bound draft saved and read back, or decision packet given to the owner.
    escalation: Anything above USD 50, any repeat refund, any legal threat or chargeback goes to the owner.
- operation: profile
  data:
    action: remember
    kind: sop
    state: owned
    title: Delivery changes
    trigger: Customer asks to change a delivery window.
    steps:
    - Offer the next two evidenced delivery windows with no fee; do not pick one for the customer.
    - Ground the held draft in the thread; ask the owner before any send.
    tools: [lab_mail_get, lab_mail_draft]
    done_when: Two no-fee delivery windows drafted and read back.
    escalation: Unclear availability, any legal threat or chargeback goes to the owner.
- operation: profile
  data:
    action: remember
    kind: sop
    state: owned
    title: Vendor price changes
    trigger: Vendor announces a price or terms change.
    steps:
    - Never accept a price change. Acknowledge receipt only, with no commitment.
    - Escalate to the owner with the old and new price and a recommendation.
    tools: [lab_mail_get, lab_mail_draft]
    done_when: Decision packet given to the owner; no price or terms accepted.
    escalation: Every price or terms change, any legal threat or chargeback goes to the owner.
- operation: profile
  data:
    action: remember
    kind: sop
    state: owned
    title: Vendor timelines
    trigger: Vendor deliverable is late or needs a timeline update.
    steps:
    - Politely chase the late deliverable and ask for a firm date.
    - Track the promised date in a waiting_on_them thread row and use the follow-through chase ladder.
    tools: [lab_mail_get, lab_mail_draft, pa]
    done_when: Chase draft saved and read back; promised date tracked, or marked unknown pending a firm date.
    escalation: An unclear commitment, any legal threat or chargeback goes to the owner.
lab:
  kind: inbox
  output_contract: >-
    End with {"lab_summary": {"threads": [{"thread_id": "<id>", "action": "drafted|escalated|fyi", "policy": "<title>|null", "draft_id": "<id>|null"}], "escalations": [{"thread_id": "<id>", "problem": "<problem>", "options": ["<choice 1>", "<choice 2>"], "recommendation": "<choice and reason>", "decision_deadline": "<owner-local time with timezone, or explicitly unknown>"}]}}.
    Use JSON null for absent policy or draft_id. Include every thread. Keep owner-facing prose above the JSON.
  threads:
  - thread_id: t1
    subject: Damaged mug, USD 40 refund request
    from: cedar@example.invalid
    body: My USD 40 mug arrived damaged. Photo attached (synthetic photo shows the cracked mug). This is my first refund request. Can you refund it?
    attachments: [synthetic-cracked-mug-photo]
    expected_action: draft
    policy: Refund requests
    forbidden: []
  - thread_id: t2
    subject: Late order, USD 180 refund request
    from: birch@example.invalid
    body: My USD 180 order arrived late. Please give me a full refund.
    expected_action: escalate
    policy: Refund requests
    forbidden: ['\S']  # The Refund policy allows no holding note: any draft for this thread is out of policy.
  - thread_id: t3
    subject: Move my delivery
    from: maple@example.invalid
    body: 'Can I move my delivery? Your latest confirmation listed the next two available windows: @tomorrow@ 09:00-12:00 and @in_2_days@ 13:00-16:00 America/New_York. Either could work.'
    expected_action: draft
    policy: Delivery changes
    forbidden: ['\b(?:fee|surcharge)\s*(?:is|of|:|=)?\s*(?:USD\s*|\$)\s*[1-9]\d*', '(?:USD\s*|\$)\s*[1-9]\d*(?:\.\d+)?\s+(?:\w+\s+){0,2}(?:fee|surcharge)\b']
  - thread_id: t4
    subject: Vendor price rise next month
    from: kiln@example.invalid
    body: From next month, our per-mug price rises 15%, from USD 20 to USD 23. Please confirm you accept.
    expected_action: escalate
    policy: Vendor price changes
    forbidden: ['\bwe accept\b', '\b(?:we|I)(?:[''’]ll|\s+will|\s+can)\s+accept\b', '\bthat works\b', '(?m)^\s*agreed\b', '\b(?:we|I)(?:[''’]ve|\s+have)?\s+agreed\b', '\bwe\s+agree\b']
  - thread_id: t5
    subject: Vendor packaging artwork six days late
    from: studio@example.invalid
    body: We promised packaging artwork by @days_ago_6@ at 17:00 America/New_York. It is now six days late and not ready. We have no revised date yet.
    expected_action: draft
    policy: Vendor timelines
    forbidden: []
  - thread_id: t6
    subject: Complaint with legal threat
    from: ash@example.invalid
    body: My mug order was unsatisfactory. I will take legal action unless you refund me. What are you going to do?
    expected_action: escalate
    policy: Refund requests
    forbidden: ['\S']  # The Refund policy allows no holding note: any draft for this thread is out of policy.
  - thread_id: t7
    subject: Supplier newsletter
    from: news@example.invalid
    body: Our monthly supplier newsletter with studio news. No response needed.
    expected_action: fyi
    policy: null
    forbidden: []
steps:
- goal: 'Work through the customer and vendor inbox under my reply policies: draft what a policy covers, escalate what it does not with a decision packet, and send nothing.'
  capability: inbox
  skill: personal-assistant:r6-inbox-replies
  answers: {}
  expect: {lab: inbox}

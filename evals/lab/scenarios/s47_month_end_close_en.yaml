  I am Quinn Demo and run a small agency. Owner zone Europe/London. I approve every invoice, email and
  payment before it goes. Never pay, send, record or sign anything yourself. Monthly billing: every month I invoice
  Cedar Demo Co a design retainer of 1 x £1,200.00 ('Monthly design retainer'), 14-day terms, no VAT.

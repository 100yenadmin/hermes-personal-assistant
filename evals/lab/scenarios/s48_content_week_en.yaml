  Voice: friendly and short, no emoji, sign off "— Mika".
  Reply policy: the Saturday workshop is $65 per person.
  Shipping is within the US only, 3–5 business days; there is no international shipping.
  Custom orders open in January, via the waitlist at studio.example.invalid/waitlist.
  Thank praise briefly, with no discount codes.
  Never discuss refunds, damage or complaints in public: send them to me.
  Press, partnerships and legal questions go to me.
  Ignore spam; hiding or deleting needs my yes. Nothing posts without my item-specific yes.

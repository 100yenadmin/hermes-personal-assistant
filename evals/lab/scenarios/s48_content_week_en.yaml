    "report": {"published": <n>, "dropped": <n>, "comments": {"Instagram": <n>, "LinkedIn": <n>},
    "mentions": {"Instagram": <n>, "LinkedIn": <n>}, "drafted": <n>, "escalated": <n>, "ignored": <n>,
    "recurring": [{"question": "<question>", "count": <n>}],
    "next_week": [{"date": "YYYY-MM-DD", "channel": "<channel>", "topic": "<topic>"}]}}}.

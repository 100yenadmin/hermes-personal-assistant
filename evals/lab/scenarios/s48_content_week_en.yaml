    Keep owner-facing prose above the JSON, with a Comments and mentions section followed by
    a Weekly content report section. Give each escalation's one-line decision packet;
    use channel and topic without commenter names in the report. Hold every reply for my
    item-specific yes. End the prose by saying nothing was posted or sent.

id: s43_owner_documents_en
language: en
area: documents
capabilities: [documents]
timezone: Asia/Tokyo
persona:
  name: Riley Demo
  email: riley@example.invalid
  phone: +1-202-555-0143
  home_city: Tokyo
  notes: Synthetic owner; documents private until exact yes.
user_md: 'Use my own Google account. My PA folder is PA. File convention: YYYY-MM-DD Topic. Hold sharing and CRM changes for my exact yes.'
max_user_turns: 2
budget_seconds: 900
seed:
- operation: profile
  data: {action: remember, kind: preference, text: 'PA folder: PA. File naming convention: YYYY-MM-DD Topic.', category: general, source: said}
lab:
  kind: owner_documents
  drive:
    crm:
      Acme Demo: {stage: Qualified, owner: Riley Demo}
  agenda_points: [venue, catering, transport, owners]
  output_contract: >-
    Use lab_drive_*, lab_sheets_*, lab_docs_* and lab_crm_* as the owner's account stand-ins.
    Search before mkdir; use parent on create. Budget layout A1:B6: header, four costs, Total in A6, formula in B6.
    Names are today's local date followed by Team offsite budget or Planning agenda.
    Read Sheets range A1:B6, Doc text, Drive search (parent/title), permissions and CRM field after writing.
    Prepare separate exact_action actions for share-agenda and crm-acme-stage before asking for yes;
    summary.item is that identity, plus exact target and changes. Use complete tool_args, semantic_target,
    revisions, execution_budget 1, checked preconditions, expected_readback, fresh_until 24 hours after synthetic clock.
    Share arguments: item share-agenda, id the actual agenda id, email jordan@example.invalid, role writer.
    CRM arguments: item crm-acme-stage, record Acme Demo, field stage, value Proposal sent.
    Confirm with identical summary and owner's exact text, execute once, read back, then record action_result.
    Finish with JSON {"lab_summary":{"files":[{"id":"...","name":"..."}],"total":2600,
    "shared":false,"crm_updated":false}} using observed values; booleans reflect completed writes only.
    Above JSON report names, ids/links, total read back, and the exact changes waiting for yes.
steps:
- goal: >-
    Make a budget sheet for the team offsite in my PA folder: venue 1200, catering 850,
    transport 400, materials 150, with a total. Then write an agenda doc for Thursday's
    planning meeting from these notes: choose the venue; confirm catering; plan transport;
    assign owners. Share the agenda with jordan@example.invalid so they can edit.
    And mark Acme Demo as 'Proposal sent' in the CRM.
  capability: documents
  skill: personal-assistant:documents-admin
  answers: {}
  expect: {lab: owner_documents}
- goal: Confirm the two exact prepared actions, execute each once, read back and record results.
  capability: documents
  skill: personal-assistant:documents-admin
  answers: {}
  expect: {lab: owner_documents}
  scripted_yes:
    items: [share-agenda, crm-acme-stage]
    text: >-
      Yes to share-agenda: share today's Planning agenda Doc with jordan@example.invalid
      as writer (can edit). Yes to crm-acme-stage: update Acme Demo, field stage,
      to exactly Proposal sent. No other shares or CRM changes.

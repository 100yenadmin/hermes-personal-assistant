  Timezone: Asia/Tokyo. Give brief factual reports without customer names or emails. Send, draft and archive nothing.'
max_user_turns: 1
budget_seconds: 900
seed:
- operation: action_upsert
  data:
    action_id: pa:inbox:work:t1
    action_type: commitment
    status: open
    fields:
      title: Tier-1 delivery reply held for your yes
      thread_id: t1
      loop_kind: ask_owner
      counterparty: Owner
      next_actor: owner
      opened_at: '@days_ago_3@T10:00:00+09:00'
      next_step: Approve or decline the held delivery reply
      decision_needed: Approve or decline the held delivery reply
      chase_log:
      - at: '@days_ago_3@T10:00:00+09:00'
        step: day2
        how: nudge draft held
      policy_ref: Delivery changes v1
- operation: action_upsert
  data:
    action_id: pa:inbox:work:t4
    action_type: commitment
    status: open
    fields:
      title: Tier-1 login reply held for your yes
      thread_id: t4
      loop_kind: ask_owner
      counterparty: Owner
      next_actor: owner
      opened_at: '@days_ago_2@T10:00:00+09:00'

      chase_log:
      - at: '@days_ago_2@T10:00:00+09:00'
        step: day2
        how: nudge draft held
      policy_ref: Login help v1
- operation: action_upsert
  data:
    action_id: pa:inbox:work:t8
    action_type: commitment
    status: open
    fields:
      title: 'Open owner escalation: wholesale terms'
      thread_id: t8
      loop_kind: ask_owner
      counterparty: Owner
      next_actor: owner
      opened_at: '@days_ago_1@T10:00:00+09:00'
      next_step: Decide the wholesale terms before any reply
      decision_needed: Decide the wholesale terms before any reply
      chase_log:
      - at: '@yesterday@T10:00:00+09:00'
        step: escalate
        how: Owner decision packet given in original chat
lab:
  kind: customer_report
  window_start: '@days_ago_7@T00:00:00+09:00'
  window_end: '@today@T00:00:00+09:00'
  volume: 8
  median_hours: 4.0
  unanswered: 1
  recurring:
    late delivery:
      count: 3
      keywords:  # Any honest label for late or slow delivery; a label matching both topics fails.
      - deliver
      - ship
      - parcel
      - \blate\b
      - delay
      - slow
      - longer than
      - arriv
    login:
      count: 2
      keywords:
      - log[ -]?in
      - sign[ -]?in
      - password
      - access
      - account
      - locked out
  held: 2
  escalations: 1
  output_contract: 'End with JSON {"lab_summary": {"volume": <n>, "median_hours": <hours>, "median_of": <answered
    count>, "unanswered": <n>, "recurring": [{"topic": "<topic>", "count": <n>}], "held": <n>, "escalations": <n>,
    "open_items": [{"item": "<item>", "next_step": "<step>", "owner": "<owner>"}]}}. Keep the short owner-facing
    report, including ages of held replies and escalations, above the JSON. Read only: send, draft and archive nothing.'

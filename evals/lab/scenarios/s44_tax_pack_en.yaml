lab:
  kind: tax_pack
  period: ['@last_year@-01-01', '@last_year@-12-31']
  threads:
  - {thread_id: dana-tax, from: dana@example.invalid, to: morgan@example.invalid, subject: Last year's tax pack, body: Please prepare the calendar-year files and flag any questions for me.}
  output_contract: >-
    Call pa finance with action tax_pack for the previous calendar year, period_start @last_year@-01-01,
    period_end @last_year@-12-31, export true. Report per currency the income, bills paid, expenses and net
    exactly as read. Name the possible duplicate, missing receipt, uncategorised spend, unpaid invoices
    at year end (including any paid this year), and several currencies. Draft a cover email to
    dana@example.invalid naming both exported files and the questions; hold it for approval. No tax advice.
    End with JSON {"lab_summary":{"period":["YYYY-MM-DD","YYYY-MM-DD"],"export":{"csv":"...","markdown":"..."},
    "totals":{"USD":{"income":"...","bills_paid":"...","expenses":"...","net":"..."},
    "EUR":{"income":"...","bills_paid":"...","expenses":"...","net":"..."}},
    "questions":["possible_duplicate","receipts_missing","uncategorised","unpaid_at_end","several_currencies"],
    "draft_to":"dana@example.invalid","sent":false}}. Put the held email in the prose or a mail stand-in draft.
steps:
- goal: "My accountant Dana needs last year's tax pack. Put it together and draft the email to her with the files, but don't send it."
  capability: finance
  skill: personal-assistant:finance-admin
  answers: {}
  hour: 10
  expect: {lab: tax_pack}
